{% extends "base.html" %}
{% block title %}Private Control Room{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">{% endblock %}
{% block body %}
<main class="login-shell"><div class="login-card">
<div class="lock">🔐</div><div class="eyebrow">PRIVATE CONTROL ROOM</div><h1>Welcome back.</h1><p>This area is for the GGL owner only.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('admin_login_post') }}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Enter dashboard →</button></form>
</div></main>
{% endblock %}
